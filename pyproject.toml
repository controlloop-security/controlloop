[build-system]
requires = ["hatchling>=1.28,<2", "hatch-fancy-pypi-readme>=25.1,<26"]
build-backend = "hatchling.build"

[project]
name = "controlloop"
version = "0.6.0"
description = "Local-first security scanner and deterministic CI gate for AI agents"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dynamic = ["readme"]
dependencies = [
    "pathspec>=1.1.1,<2",
    "pydantic>=2.12,<3",
    "python-hcl2>=8.1.2",
    "pyyaml>=6.0.3",
    "typer>=0.21,<1",
]

[project.urls]
Homepage = "https://controlloop.ai"
Documentation = "https://github.com/controlloop-security/controlloop/blob/main/docs/readme.md"
Repository = "https://github.com/controlloop-security/controlloop"
Issues = "https://github.com/controlloop-security/controlloop/issues"
Changelog = "https://github.com/controlloop-security/controlloop/blob/main/CHANGELOG.md"

[project.scripts]
controlloop = "controlloop.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "mypy>=1.19,<2",
    "pre-commit>=4,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    "types-pyyaml>=6.0.12.20260815",
]
release = [
    "pyinstaller>=6,<7",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlloop"]

# The PyPI project page shows README.md, but pypi.org cannot resolve its
# repository-relative links and images. These substitutions rewrite them to
# absolute GitHub URLs in the package metadata only; README.md itself is
# unchanged. Images first, so the link pattern sees them already absolute.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)#]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/controlloop-security/controlloop/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/controlloop-security/controlloop/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#([^)]+)\)'
replacement = '](https://github.com/controlloop-security/controlloop#\1)'

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
    "--cov=controlloop",
    "--cov-fail-under=85",
    "--cov-report=term-missing",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]
